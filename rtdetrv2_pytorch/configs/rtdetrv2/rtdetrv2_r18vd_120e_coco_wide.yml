__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_r18vd_120e_coco_wide


PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: False
  pretrained: True


# Widened Baseline: CSPRepLayer with increased hidden_dim + expansion
# Goal: match FreqSpatial's ~69M parameters using spatial-only convolutions
HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 464              # increased from 256
  expansion: 1.0               # increased from 0.5 (bottleneck at hidden_dim, not hidden_dim/2)
  depth_mult: 1                 # keep 3 RepVggBlocks per CSP node
  dim_feedforward: 2048         # scaled to maintain ~4.4x ratio with hidden_dim
  fpn_block_type: csp           # default CSPRepLayer


RTDETRTransformerv2:
  num_layers: 3
  hidden_dim: 464               # match HybridEncoder hidden_dim
  feat_channels: [464, 464, 464]  # match hidden_dim


epoches: 1

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.


train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~
  total_batch_size: 32
